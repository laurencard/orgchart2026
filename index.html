let _id = 1000;
function loadSavedData() {
  try {
    if (typeof localStorage === "undefined") return ensureUnallocatedFromSlack(buildInitialData());
    const raw = localStorage.getItem(STORAGE_KEY);
    const base = raw ? normalizeTeams(JSON.parse(raw)) : buildInitialData();
    return ensureUnallocatedFromSlack(base);
  } catch {
    return ensureUnallocatedFromSlack(buildInitialData());
  }
}
const uid = () => `id_${_id++}`;
function countPeople(team, includeTBD = true) {
  let c = (team.people || []).filter(p => includeTBD || !p.isTBD).length;
  if (team.head && (includeTBD || !team.head.isTBD)) c++;
  (team.subteams || []).forEach(st => {
    c += countPeople(st, includeTBD);
  });
  return c;
}
function flattenPeople(teams) {
  let result = [];
  teams.forEach(t => {
    if (t.head) result.push({
      ...t.head,
      teamId: t.id
    });
    (t.people || []).forEach(p => result.push({
      ...p,
      teamId: t.id
    }));
    if (t.subteams) result = result.concat(flattenPeople(t.subteams));
  });
  return result;
}
function collectOpenRoles(teams, hiringManager = null) {
  let roles = [];
  teams.forEach(t => {
    const mgr = t.head ? t.head.name : hiringManager;
    (t.people || []).forEach(p => {
      if (p.isTBD) roles.push({
        title: p.title || p.role || "",
        team: t.name,
        hiringManager: mgr || "Unassigned"
      });
    });
    if (t.subteams) roles = roles.concat(collectOpenRoles(t.subteams, mgr));
  });
  return roles;
}
const makePerson = (name, title = "", workingHours = null, isTBD = false, photoUrl = null) => ({
  id: uid(),
  name,
  title,
  workingHours,
  isTBD,
  photoUrl
});
function normalizePerson(p) {
  if (!p) return p;
  const {
    role,
    startDate,
    description,
    email,
    location,
    ...rest
  } = p;
  return {
    ...rest,
    title: rest.title ?? role ?? "",
    workingHours: rest.workingHours ?? null
  };
}
function normalizeTeams(list) {
  return list.map(t => ({
    ...t,
    head: t.head ? normalizePerson(t.head) : null,
    people: (t.people || []).map(normalizePerson),
    subteams: normalizeTeams(t.subteams || [])
  }));
}
const makeTeam = (name, head = null, people = [], subteams = [], logo = null, color = null) => ({
  id: uid(),

function normalizePersonKey(name) {
  return String(name || "")
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .replace(/[^a-z0-9\s]/g, " ")
    .replace(/\s+/g, " ")
    .trim();
}

function personKeysMatch(a, b) {
  const na = normalizePersonKey(a);
  const nb = normalizePersonKey(b);
  if (!na || !nb) return false;
  if (na === nb) return true;
  if (na.includes(nb) || nb.includes(na)) return true;
  const stop = new Set(["jr", "sr", "ii", "iii", "iv"]);
  const ta = na.split(" ").filter(t => t.length > 1 && !stop.has(t));
  const tb = nb.split(" ").filter(t => t.length > 1 && !stop.has(t));
  if (ta.length >= 2 && tb.length >= 2) {
    if (ta[0] + " " + ta[ta.length - 1] === tb[0] + " " + tb[tb.length - 1]) return true;
    if (ta[ta.length - 1] === tb[tb.length - 1] && (ta[0].startsWith(tb[0]) || tb[0].startsWith(ta[0]))) return true;
  }
  if (ta.length === 1 && tb[0] === ta[0]) return true;
  if (tb.length === 1 && ta[0] === tb[0]) return true;
  return false;
}

function ensureUnallocatedFromSlack(teams) {
